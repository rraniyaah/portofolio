<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pemesanan</title>
</head>
<body> 

    <h2>Bu Faridhah Premium Frozen Foods</h2>

    <form action="">
        <hr>
        <table>
            <tr>
                <td><label for:"">Nama Pelanggan</label></td>
                <td>:</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td><label for:"">Email Pelanggan</label></td>
                <td>:</td>
                <td><input type="email"></td>
            </tr>
            <tr>
                <td><label for="">Nomor HP Pelanggan</label></td>
                <td>:</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td><label for="produk">Pilihan Produk</label></td>
                <td>:</td>
                <td>
                    <input type="radio" name="produk" value="Nugget Ayam">Nugget Ayam<br>
                    <input type="radio" name="produk" value="Sosis">Sosis<br>
                    <input type="radio" name="produk" value="Kentang">Kentang<br>
                    <input type="radio" name="produk" value="Tempura">Tempura<br>
                    <input type="radio" name="produk" value="Bakso">Bakso<br>
                    <input type="radio" name="produk" value="Dimsum">Dimsum<br>
                </td>
            </tr>
            <tr>
                <td><label for="">Tanggal Pengambilan</label></td>
                <td>:</td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td><label for="">Waktu Pengambilan</label></td>
                <td>:</td>
                <td><input type="time"></td>
            </tr>
            <tr>
                <td><label for="">Jumlah Produk</label></td>
                <td>:</td>
                <td><input type="number"></td>
            </tr>
            <tr>
                <td><label for="metode">Metode Pengambilan</label></td>
                <td>:</td>
                <td>
                    <input type="radio" name="metode" value="Ambil di Toko">Ambil di Toko<br>
                    <input type="radio" name="metode" value="Diantar ke Rumah">Diantar ke Rumah<br>
                </td>
            </tr>
            <tr>
                <td><label for="tambahan">Pilihan Tambahan</label></td>
                <td>:</td>
                <td>
                    <input type="checkbox" name="tambahan" value="Saus Sambal">Saus Sambal<br>
                    <input type="checkbox" name="tambahan" value="Mayonnaise">Mayonnaise<br>
                    <input type="checkbox" name="tambahan" value="Saus Keju">Saus Keju<br>
                </td>
            </tr>

            <tr>
                <td><label for="">Upload Bukti Pembayaran</label></td>
                <td>:</td>
                <td><input type="file"></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td>
                    <input type="submit" value="Kirim Pesanan">
                    <input type="reset" value="Reset Form">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
